name: Build and Publish to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Rebuild periodically so the deployed client picks up territorial.io game
  # updates without needing a manual push (game/ is gitignored and re-downloaded
  # fresh on every build).
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: Build Project
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
